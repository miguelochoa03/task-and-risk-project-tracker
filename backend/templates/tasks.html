<!DOCTYPE html>
<html>
    <head>
        <title>Tasks</title>
    </head>

    <body>
        <p>
            <a href="/pages">Dashboard</a>
            <a href="/pages/tasks">Tasks</a>
            <a href="/pages/risks">Risks</a>
        </p>
        <h1>Tasks</h1>
        <p><a href="/pages/tasks/new">New task</a></p>
        <table border="1">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Owner</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Due date</th>
                <th></th>
            </tr>
            {% for task in tasks %}
            <tr>
                <td>{{ task.id }}</td>
                <td>{{ task.title }}</td>
                <td>{{ task.owner }}</td>
                <td>{{ task.priority }}</td>
                <td>{{ task.status }}</td>
                <td>{{ task.due_date }}</td>
                <td><a href="/pages/tasks/{{ task.id }}/edit">Edit</a></td>
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
