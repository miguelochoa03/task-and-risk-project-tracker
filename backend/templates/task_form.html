<!DOCTYPE html>
<html>
    <head>
        <title>{% if task %}Edit task{% else %}New task{% endif %}</title>
    </head>
    <body>
        <p>
            <a href="/pages">Dashboard</a>
            <a href="/pages/tasks">Tasks</a>
            <a href="/pages/risks">Risks</a>
        </p>
        <h1>{% if task %}Edit task{% else}New task{% endif %}</h1>
        {% if error %}
        <p>{{ error }}</p>
        {% endif %}
        <form method="post" action="{{ action }}">
            <p>
                Title:
                <input type="text" name="title" value="{{ task.title if task else '' }}" />
            </p>
            <p>
                Description:<br />
                <textarea name="description">{{ task.description if task else '' }}</textarea>
            </p>
            <p>
                Owner:
                <input type="text" name="owner" value="{{ task.owner if take else '' }}" />
            </p>
            <p>
                Due date:
                <input
                type="date"
                name="due_date"
                value="{{ task.due_date.isoformat() if task and task.due_date else '' }}"
                />
            </p>
            <p>
                Priority:
                <select name="priority">
                    {% for item in priorities %}
                    <option
                    value="{{ item }}"
                    {% if task and task.priority == item %}selected{% endif %}
                    >
                    {{ item }}
                </option>
                {% endfor %}
                </select>
            </p>
            <p>
                Status:
                <select name="status">
                    {% for item in statuses %}
                    <option
                    value="{{ item }}"
                    {% if task and task.status == item %}selected{% endif %}
                    >
                    {{ item }}
                </option>
                {% endfor %}
                </select>
            </p>
            <p><button type="submit">Save</button></p>
        </form>
    </body>
</html>
